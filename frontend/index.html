<!DOCTYPE html>
<html lang="en" class="dark transition-opacity duration-700">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet2Action | Meetings to Actionable Insights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="/src/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* Critical Fade-In to prevent FOUC */
    body {
      opacity: 0;
      transition: opacity 0.5s ease-in;
      background-color: #020617;
    }

    body.ready {
      opacity: 1;
    }
  </style>
</head>

<body class="selection:bg-blue-500/30">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    // Reveal body after load to avoid styler flickering
    document.addEventListener('DOMContentLoaded', () => document.body.classList.add('ready'));
  </script>
</body>

</html>
